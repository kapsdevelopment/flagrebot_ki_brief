<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prøv en presentasjon der robotavataren bretter ut teksten på et papirark.">
  <title>AI-brief på papir</title>
  <link rel="stylesheet" href="papir.css?v=15">
  <script src="head.js" defer></script>
  <script src="idle.js?v=10" defer></script>
  <script src="spin.js" defer></script>
  <script src="robot.js?v=7" defer></script>
  <script src="slides.js?v=6" defer></script>
  <script src="papir.js?v=13" defer></script>
</head>
<body>
  <main id="presentation" tabindex="0" aria-label="KI-brief"
        aria-keyshortcuts="ArrowLeft ArrowRight ArrowUp ArrowDown PageUp PageDown Enter Space"
        aria-description="Klikk til venstre for forrige side eller til høyre for neste. Du kan også bruke piltastene eller Page Up og Page Down.">
    <div class="digital-pattern" aria-hidden="true">
      <span>1 0 0 1 1 0 1 1 1 0 0</span>
      <span>0 1 1 0 KI 0 0 1 1 0</span>
      <span>1 0 1 1 0 0 KI 0 0 1</span>
      <span>0 KI 1 0 1 1 0 1 0 0</span>
    </div>
    <div class="scene-wrap" id="paper-slide">
      <div class="scene" id="scene" data-paper="open">
        <div class="floor-shadow" aria-hidden="true"></div>
        <canvas class="rear-grip" id="rear-grip" width="1086" height="1448" aria-hidden="true"></canvas>
        <article class="sheet" id="letter">
          <div class="paper-flap">
            <div class="paper-front">
              <h2 id="page-title"></h2>
            </div>
          </div>
          <div class="paper-bottom">
            <div class="page-copy" id="page-copy"></div>
          </div>
        </article>
        <div class="robot avatar-view">
          <canvas id="avatar" width="1086" height="1448" role="img" aria-label="Animert Flagrebot"></canvas>
          <canvas id="idle-eyes" width="1086" height="1448" aria-hidden="true" hidden></canvas>
        </div>
      </div>
    </div>
    <section class="closing-slide" id="closing-slide" aria-labelledby="closing-title" hidden>
      <h2 id="closing-title"></h2>
      <div class="closing-layout">
        <div class="closing-pair">
          <div class="closing-photo">
            <img src="flagrebot-original.jpg" width="768" height="1024" alt="Den ekte Flagrebot, en hvit robot med rosa detaljer">
          </div>
          <div class="closing-avatar" id="closing-avatar"></div>
        </div>
        <div class="closing-metrics" id="closing-metrics"></div>
      </div>
    </section>
    <p class="visually-hidden" id="status" role="status"></p>
    <noscript><p>Slå på JavaScript for å prøve papirvisningen.</p></noscript>
  </main>
</body>
</html>
