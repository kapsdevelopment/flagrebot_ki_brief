<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prøv en presentasjon der robotavataren bretter ut teksten på et papirark.">
  <title>AI-brief på papir</title>
  <link rel="stylesheet" href="papir.css?v=8">
  <script src="head.js" defer></script>
  <script src="idle.js?v=10" defer></script>
  <script src="spin.js" defer></script>
  <script src="robot.js?v=7" defer></script>
  <script src="slides.js" defer></script>
  <script src="papir.js?v=7" defer></script>
</head>
<body>
  <main id="presentation" tabindex="0" aria-label="KI-brief"
        aria-keyshortcuts="Enter Space ArrowRight"
        aria-description="Trykk Enter, mellomrom eller høyrepil for å gå til neste side.">
    <div class="scene-wrap">
      <div class="scene" id="scene" data-paper="open">
        <div class="floor-shadow" aria-hidden="true"></div>
        <canvas class="rear-grip" id="rear-grip" width="1086" height="1448" aria-hidden="true"></canvas>
        <article class="sheet" id="letter">
          <div class="paper-flap">
            <div class="paper-front">
              <p class="page-index" id="page-index"></p>
              <h2 id="page-title"></h2>
            </div>
          </div>
          <div class="paper-bottom">
            <p class="page-copy" id="page-copy"></p>
          </div>
        </article>
        <div class="robot avatar-view">
          <canvas id="avatar" width="1086" height="1448" role="img" aria-label="Robotavataren ved siden av arket"></canvas>
          <canvas id="idle-eyes" width="1086" height="1448" aria-hidden="true" hidden></canvas>
        </div>
      </div>
    </div>
    <p class="visually-hidden" id="status" role="status"></p>
    <noscript><p>Slå på JavaScript for å prøve papirvisningen.</p></noscript>
  </main>
</body>
</html>
